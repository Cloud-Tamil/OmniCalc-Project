services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnicalc:latest
    container_name: OmniCalc-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/calc/history"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
