<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Body -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" filter="url(#softShadow)"/>

  <!-- Screen -->
  <rect x="26" y="24" width="76" height="24" rx="7" fill="url(#screenGrad)"/>

  <!-- Keypad Row 1 -->
  <rect x="26" y="58" width="20" height="18" rx="6" fill="#94a3b8"/>
  <rect x="54" y="58" width="20" height="18" rx="6" fill="#94a3b8"/>
  <rect x="82" y="58" width="20" height="18" rx="6" fill="#94a3b8"/>

  <!-- Keypad Row 2 -->
  <rect x="26" y="84" width="20" height="18" rx="6" fill="#94a3b8"/>
  <rect x="54" y="84" width="20" height="18" rx="6" fill="#94a3b8"/>
  <rect x="82" y="84" width="20" height="18" rx="6" fill="url(#emeraldKey)"/>
</svg>
