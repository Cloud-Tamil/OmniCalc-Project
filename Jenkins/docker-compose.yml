services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-controller
    restart: unless-stopped
    privileged: false
    user: root # Runs with root inside container to ensure access to host docker socket
    ports:
      - "8080:8080"   # Jenkins Web UI
      - "50000:50000" # Jenkins Agent connection port
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true -Xmx2048m
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount host Docker socket to enable building and running Docker containers from Jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-net

volumes:
  jenkins_home:
    name: jenkins_home_data

networks:
  jenkins-net:
    driver: bridge
